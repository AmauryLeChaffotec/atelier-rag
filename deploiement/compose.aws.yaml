# À combiner avec compose.yaml, depuis la racine du projet.
services:
  base:
    ports: !reset []
    mem_limit: 384m
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    logging: &journaux
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  serveur:
    ports: !reset []
    mem_limit: 512m
    environment:
      ENVIRONNEMENT: production
      FOURNISSEUR_IA: openai
      CLE_ACCES: ${CLE_ACCES:?Renseignez CLE_ACCES dans .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Renseignez OPENAI_API_KEY dans .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql://atelier:${POSTGRES_PASSWORD}@base:5432/atelier}
    logging: *journaux
  interface:
    ports: !reset []
    mem_limit: 320m
    environment:
      COOKIE_SECURISE: "true"
    logging: *journaux
  entree:
    image: caddy:2.10.2-alpine
    environment:
      DOMAINE: ${DOMAINE:?Renseignez DOMAINE dans .env}
      EMAIL_TLS: ${EMAIL_TLS:?Renseignez EMAIL_TLS dans .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploiement/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificats:/data
      - configuration_entree:/config
    depends_on:
      interface:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    logging: *journaux
volumes:
  certificats:
  configuration_entree:
